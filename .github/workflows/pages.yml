# 把前端的模拟模式部署到 GitHub Pages，作为在线演示（不需要后端和 API Key）
# 首次使用：仓库 Settings → Pages → Source 选 "GitHub Actions"
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build (mock mode)
        run: npx vite build --base=/${{ github.event.repository.name }}/
        working-directory: frontend
        env:
          VITE_MOCK: '1'
      # 单页应用：直接打开 /<仓库名>/rooms/xxx 时由 404.html 接管
      - run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
